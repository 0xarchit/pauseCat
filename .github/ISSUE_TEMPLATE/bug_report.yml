name: Bug Report
description: File a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen
      placeholder: Tell us what you did and what went wrong
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      description: e.g. Windows 11 Pro 23H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: App Logs
      description: Please paste logs from `%APPDATA%\PauseCat\app.log`
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
