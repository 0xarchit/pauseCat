name: Coverage

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  coverage:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate Coverage
        id: generate
        run: |
          $out = cargo tarpaulin --out stdout
          $match = $out | Select-String -Pattern "(\d+(\.\d+)?)% coverage" | Select-Object -First 1
          if ($match) {
              $percent = $match.Matches[0].Groups[1].Value
              echo "COVERAGE_PERCENT=$percent" >> $env:GITHUB_ENV
              echo "parsed=true" >> $env:GITHUB_OUTPUT
          } else {
              Write-Warning "Could not parse coverage percentage from Tarpaulin output. Skipping badge update."
              echo "parsed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Update README Badge
        if: steps.generate.outputs.parsed == 'true'
        run: |
          $percent = $env:COVERAGE_PERCENT
          $readme = Get-Content README.md -Raw
          $new_readme = $readme -replace 'Coverage-\d+(\.\d+)?%25', "Coverage-$percent%25"
          Set-Content README.md $new_readme

      - name: Commit Badge Update
        if: steps.generate.outputs.parsed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update coverage badge to $env:COVERAGE_PERCENT%" || exit 0
          git push
