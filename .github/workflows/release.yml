name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d87651d2a74e044a2940971703c204e3963

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Install WiX Extensions
        run: |
          wix eula accept
          wix extension add -g WixToolset.UI.wixext
          wix extension add -g WixToolset.Util.wixext

      - name: Build Optimized Binary
        run: |
          $env:RUSTFLAGS="-C link-arg=/OPT:REF -C link-arg=/OPT:ICF"
          cargo build --release

      - name: Build MSI Installer
        run: |
          wix build wix/main.wxs -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -o target/release/PauseCat_Installer.msi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@3bb1273295061458407f9736eb729ad897735916
        with:
          files: |
            target/release/PauseCat_Installer.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
