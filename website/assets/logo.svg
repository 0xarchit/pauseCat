<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%"><defs><!-- Relaxing Gradient for the Pause Symbol --><linearGradient id="pauseGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A855F7"/><!-- Soft Purple --><stop offset="100%" stop-color="#3B82F6"/><!-- Calming Blue --></linearGradient><!-- Soft Drop Shadow to help the logo pop on any background --><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/></filter></defs><g filter="url(#softShadow)"><!-- LEFT EAR --><path d="M 160 135 L 120 40 L 220 95 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="14" stroke-linejoin="round"/><path d="M 155 110 L 135 65 L 195 90 Z" fill="#FBCFE8"/><!-- RIGHT EAR --><path d="M 340 135 L 380 40 L 280 95 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="14" stroke-linejoin="round"/><path d="M 345 110 L 365 65 L 305 90 Z" fill="#FBCFE8"/><!-- CAT HEAD --><ellipse cx="250" cy="190" rx="130" ry="95" fill="#FFFFFF" stroke="#1E293B" stroke-width="14"/><!-- PAUSE BARS --><rect x="150" y="240" width="60" height="180" rx="25" fill="url(#pauseGrad)" stroke="#1E293B" stroke-width="12"/><rect x="290" y="240" width="60" height="180" rx="25" fill="url(#pauseGrad)" stroke="#1E293B" stroke-width="12"/><!-- PAWS (Resting on top of the bars) --><rect x="145" y="220" width="70" height="60" rx="30" fill="#FFFFFF" stroke="#1E293B" stroke-width="14"/><rect x="285" y="220" width="70" height="60" rx="30" fill="#FFFFFF" stroke="#1E293B" stroke-width="14"/><!-- PAW TOE LINES --><line x1="165" y1="250" x2="165" y2="275" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/><line x1="195" y1="250" x2="195" y2="275" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/><line x1="305" y1="250" x2="305" y2="275" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/><line x1="335" y1="250" x2="335" y2="275" stroke="#1E293B" stroke-width="8" s