<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PauseCat Break</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .container {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .animation {
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
        }

        #timer {
            font-size: 2rem;
            margin: 20px 0;
            font-weight: 300;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s;
            margin-top: 20px;
        }

        button:hover {
            background: white;
            color: black;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Placeholder for cat animation -->
        <div class="animation">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <circle cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="2" stroke-dasharray="10 5" />
                <text x="50" y="55" font-size="30" text-anchor="middle" fill="white">🐾</text>
            </svg>
        </div>
        <h1>Take a break</h1>
        <div id="timer">--:--</div>
        <button onclick="dismiss()">Skip</button>
    </div>

    <script>
        function dismiss() {
            window.chrome.webview.postMessage({ action: "dismiss" });
        }

        // Basic timer logic
        let seconds = 300; // Default 5 mins
        function updateTimer() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').innerText = 
                `${mins}:${secs.toString().padStart(2, '0')}`;
            if (seconds > 0) seconds--;
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
