<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PauseCat Break</title>
    <style>
        :root {
            --bubble-size: 580px;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 60px; /* Padding for top-left position */
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: flex-start; /* Move to left */
            align-items: flex-start;    /* Move to top */
            height: 100vh;
            box-sizing: border-box;
        }

        #bg-media-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: black; /* Prevent flash */
        }

        #bg-image, #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            display: block;
        }

        .floating-bubble {
            width: var(--bubble-size);
            height: var(--bubble-size);
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: bubbleFloat 8s ease-in-out infinite, fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .timer-display {
            font-size: 7.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 5px;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: 600;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .actions {
            position: absolute;
            bottom: 60px;
        }

        button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 36px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        @keyframes bubbleFloat {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(10px, -15px); }
            66% { transform: translate(-10px, 5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="bg-media-container">
        <img id="bg-image" class="hidden">
        <video id="bg-video" class="hidden" autoplay loop muted playsinline></video>
    </div>

    <div class="floating-bubble">
        <div class="status-text" id="status">Breathe In...</div>
        <div class="timer-display" id="timer">--:--</div>
        
        <div class="actions">
            <button id="skip-btn" onclick="dismiss()">Skip Break</button>
        </div>
    </div>

    <script>
        function dismiss() {
            window.chrome.webview.postMessage({ action: "dismiss" });
        }

        let seconds = 300;
        function updateTimer() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').innerText = 
                `${mins}:${secs.toString().padStart(2, '0')}`;
            if (seconds > 0) seconds--;
        }

        window.chrome.webview.addEventListener('message', event => {
            if (event.data.action === "init") {
                seconds = event.data.duration;
                if (event.data.mode === "hard") {
                    document.getElementById('skip-btn').classList.add('hidden');
                    document.getElementById('status').innerText = "Focus on resting";
                }
                
                if (event.data.mediaPath) {
                    const img = document.getElementById('bg-image');
                    const video = document.getElementById('bg-video');
                    
                    const ext = event.data.mediaPath.split('.').pop().toLowerCase();
                    if (['mp4', 'webm', 'ogg'].includes(ext)) {
                        video.src = event.data.mediaPath;
                        video.classList.remove('hidden');
                        video.play().catch(e => console.error("Autoplay failed:", e));
                    } else {
                        img.src = event.data.mediaPath;
                        img.classList.remove('hidden');
                    }
                }
                updateTimer();
            }
        });

        // Inform Rust that we are ready to receive the init data
        window.onload = () => {
            window.chrome.webview.postMessage({ action: "ready" });
        };

        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
