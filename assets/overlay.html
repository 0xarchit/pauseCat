<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PauseCat Break</title>
    <style id="base-styles">
        :root {
            --bubble-size: 580px;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --pos-x: 5%;
            --pos-y: 5%;
        }

        body.dark {
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            transition: color 0.3s;
            position: relative;
        }

        #bg-media-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: black;
        }

        #bg-image, #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            display: block;
        }

        .floating-bubble {
            position: absolute;
            left: var(--pos-x);
            top: var(--pos-y);
            width: var(--bubble-size);
            height: var(--bubble-size);
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            transition: background 0.3s, border-color 0.3s, width 0.3s, height 0.3s, left 0.3s, top 0.3s;
        }

        .timer-display {
            font-size: 7.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.04em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 5px;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: 600;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: opacity 0.5s ease;
        }

        .work-status {
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.6;
            margin-top: 10px;
        }

        .actions {
            position: absolute;
            bottom: 60px;
        }

        button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 36px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hidden { display: none !important; }

        /* 3D Text Fallback */
        .fallback-text-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: -1;
            perspective: 1000px;
            background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
        }

        .fallback-text-3d {
            font-size: 15vw;
            font-weight: 900;
            color: var(--text-color, #fff);
            text-transform: uppercase;
            letter-spacing: -0.05em;
            transform: rotateX(var(--rot-x, 20deg)) rotateY(var(--rot-y, -20deg));
            
            /* High-Fidelity Shadow / Extrusion / Glow */
            text-shadow: var(--text-3d-shadow);
            filter: drop-shadow(0 0 var(--text-glow-radius, 10px) var(--text-color, #fff));
            
            opacity: var(--text-opacity, 0.15);
            user-select: none;
            pointer-events: none;
            text-align: center;
        }

        @keyframes textFloat {
            0%, 100% { transform: rotateX(var(--rot-x, 20deg)) rotateY(var(--rot-y, -20deg)) translateZ(0); }
            50% { transform: rotateX(calc(var(--rot-x, 20deg) + 5deg)) rotateY(calc(var(--rot-y, -20deg) + 5deg)) translateZ(50px); }
        }

        @keyframes textRotate {
            0% { transform: rotateX(var(--rot-x, 20deg)) rotateY(0deg); }
            100% { transform: rotateX(var(--rot-x, 20deg)) rotateY(360deg); }
        }

        @keyframes textSwing {
            0%, 100% { transform: rotateX(var(--rot-x, 20deg)) rotateY(-40deg); }
            50% { transform: rotateX(var(--rot-x, 20deg)) rotateY(40deg); }
        }

        @keyframes textPulse {
            0%, 100% { transform: rotateX(var(--rot-x, 20deg)) rotateY(var(--rot-y, -20deg)) scale(1); opacity: var(--text-opacity, 0.15); }
            50% { transform: rotateX(var(--rot-x, 20deg)) rotateY(var(--rot-y, -20deg)) scale(1.1); opacity: calc(var(--text-opacity, 0.15) + 0.1); }
        }
    </style>
</head>
<body>
    <div id="bg-media-container">
        <div id="fallback-ui" class="fallback-text-container hidden">
            <div class="fallback-text-3d">PAUSE</div>
        </div>
        <img id="bg-image" class="hidden">
        <video id="bg-video" class="hidden" autoplay loop playsinline></video>
    </div>

    <div id="bubble-el" class="floating-bubble">
        <div class="status-text" id="status">Breathe In...</div>
        <div class="timer-display" id="timer">--:--</div>
        <div class="work-status hidden" id="work-status-text"></div>
        
        <div class="actions">
            <button id="skip-btn" onclick="dismiss()">Skip Break</button>
        </div>
    </div>

    <script>
        function dismiss() {
            window.chrome.webview.postMessage({ action: "dismiss" });
        }

        let seconds = 300;
        let breakMessages = ["Breathe In..."];
        let randomize = false;
        let currentMessageIndex = 0;

        function updateTimer() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').innerText = 
                `${mins}:${secs.toString().padStart(2, '0')}`;
            if (seconds > 0) seconds--;
        }

        function rotateMessages() {
            if (breakMessages.length <= 1) return;
            
            const statusEl = document.getElementById('status');
            statusEl.style.opacity = 0;
            
            setTimeout(() => {
                if (randomize) {
                    let nextIndex;
                    do {
                        nextIndex = Math.floor(Math.random() * breakMessages.length);
                    } while (nextIndex === currentMessageIndex && breakMessages.length > 1);
                    currentMessageIndex = nextIndex;
                } else {
                    currentMessageIndex = (currentMessageIndex + 1) % breakMessages.length;
                }
                statusEl.innerText = breakMessages[currentMessageIndex];
                statusEl.style.opacity = 0.8;
            }, 500);
        }

        function generate3DShadow(color, depth) {
            let shadows = [];
            for (let i = 1; i <= depth; i++) {
                shadows.push(`${i}px ${i}px 0px ${adjustColor(color, -i * 5)}`);
            }
            shadows.push(`0 ${depth + 1}px 10px rgba(0,0,0,0.4)`);
            shadows.push(`0 ${depth + 5}px 20px rgba(0,0,0,0.2)`);
            return shadows.join(', ');
        }

        function adjustColor(hex, amount) {
            if (hex === 'transparent' || hex === 'none') return hex;
            let usePound = false;
            if (hex[0] == "#") { hex = hex.slice(1); usePound = true; }
            let num = parseInt(hex, 16);
            let r = (num >> 16) + amount;
            if (r > 255) r = 255; else if (r < 0) r = 0;
            let b = ((num >> 8) & 0x00FF) + amount;
            if (b > 255) b = 255; else if (b < 0) b = 0;
            let g = (num & 0x0000FF) + amount;
            if (g > 255) g = 255; else if (g < 0) g = 0;
            return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
        }

        window.chrome.webview.addEventListener('message', event => {
            if (event.data.action === "init") {
                seconds = event.data.duration;
                randomize = event.data.randomizeMessages;
                
                if (event.data.mode === "hard") {
                    document.getElementById('skip-btn').classList.add('hidden');
                }

                if (event.data.isDark) document.body.classList.add('dark');
                else document.body.classList.remove('dark');

                // Apply Visual Controls
                const root = document.documentElement;
                const bubble = document.getElementById('bubble-el');
                
                root.style.setProperty('--bubble-size', event.data.bubbleSize + 'px');
                root.style.setProperty('--glass-bg', `rgba(${event.data.isDark ? '0,0,0' : '255,255,255'}, ${event.data.bubbleOpacity})`);
                
                // Smart Position
                bubble.style.left = `calc(${event.data.bubblePosX}% - ${event.data.bubbleSize * (event.data.bubblePosX/100)}px)`;
                bubble.style.top = `calc(${event.data.bubblePosY}% - ${event.data.bubbleSize * (event.data.bubblePosY/100)}px)`;
                
                if (event.data.animationStyle !== 'none') {
                    bubble.style.animation = `${event.data.animationStyle} 6s ease-in-out infinite`;
                }

                // Custom 3D Text Logic
                const fallback = document.getElementById('fallback-ui');
                const fallbackText = fallback.querySelector('.fallback-text-3d');
                if (event.data.customText) {
                    fallbackText.innerText = event.data.customText;
                }

                // Adaptive Color Logic
                let finalColor = event.data.textColor || '#ffffff';
                if (event.data.adaptiveTextColor) {
                    finalColor = event.data.isDark ? '#ffffff' : '#000000';
                }

                // Apply advanced text styles
                root.style.setProperty('--text-color', finalColor);
                root.style.setProperty('--text-opacity', event.data.textOpacity ?? 0.15);
                root.style.setProperty('--rot-x', (event.data.textRotationX ?? 20) + 'deg');
                root.style.setProperty('--rot-y', (event.data.textRotationY ?? -20) + 'deg');
                root.style.setProperty('--text-glow-radius', (event.data.textGlow ?? 10) + 'px');
                root.style.setProperty('--text-3d-shadow', generate3DShadow(finalColor, event.data.textDepth ?? 5));

                const textAnim = event.data.textAnimation || 'float';
                if (textAnim === 'float') {
                    fallbackText.style.animation = 'textFloat 8s ease-in-out infinite';
                } else if (textAnim === 'rotate') {
                    fallbackText.style.animation = 'textRotate 10s linear infinite';
                } else if (textAnim === 'swing') {
                    fallbackText.style.animation = 'textSwing 6s ease-in-out infinite';
                } else if (textAnim === 'pulse') {
                    fallbackText.style.animation = 'textPulse 4s ease-in-out infinite';
                } else {
                    fallbackText.style.animation = 'none';
                }

                if (event.data.breakStyle === 'text') {
                    fallback.classList.remove('hidden');
                } else {
                    fallback.classList.add('hidden');
                }

                // Break Messages
                if (event.data.breakMessages && event.data.breakMessages.length > 0) {
                    breakMessages = event.data.breakMessages;
                    document.getElementById('status').innerText = breakMessages[0];
                    if (breakMessages.length > 1) {
                        setInterval(rotateMessages, 5000);
                    }
                }

                // Work Duration Status
                if (event.data.showWorkStatus) {
                    const workStatusEl = document.getElementById('work-status-text');
                    workStatusEl.classList.remove('hidden');
                    const workMinsTotal = Math.floor(event.data.workDurationSecs / 60);
                    
                    if (workMinsTotal < 60) {
                        workStatusEl.innerText = `You have been working for ${workMinsTotal} minutes`;
                    } else {
                        const hours = Math.floor(workMinsTotal / 60);
                        const mins = workMinsTotal % 60;
                        const hourText = hours === 1 ? '1 hour' : `${hours} hours`;
                        const minText = mins === 0 ? '' : ` and ${mins} minutes`;
                        workStatusEl.innerText = `You have been working for ${hourText}${minText}`;
                    }
                }
                
                if (event.data.mediaPath && event.data.breakStyle !== 'text') {
                    const img = document.getElementById('bg-image');
                    const video = document.getElementById('bg-video');
                    const ext = event.data.mediaPath.split('.').pop().toLowerCase();

                    video.onerror = () => {
                        console.warn("Video load failed, showing fallback UI");
                        video.classList.add('hidden');
                        fallback.classList.remove('hidden');
                    };

                    // Set Volume
                    video.volume = event.data.videoVolume ?? 0.0;

                    if (['mp4', 'webm', 'ogg'].includes(ext)) {
                        video.src = event.data.mediaPath;
                        video.classList.remove('hidden');
                        video.play().catch(e => {
                            console.error(e);
                            video.classList.add('hidden');
                            fallback.classList.remove('hidden');
                        });
                    } else {
                        img.src = event.data.mediaPath;
                        img.classList.remove('hidden');
                    }
                }
                updateTimer();
            } else if (event.data.action === "theme_changed") {
                if (event.data.isDark) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
            }
        });

        window.onload = () => {
            window.chrome.webview.postMessage({ action: "ready" });
        };

        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
