<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PauseCat Settings</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --secondary-bg: #f9fafb;
            --text-main: #101828;
            --text-secondary: #475467;
            --accent: #7f56d9;
            --accent-hover: #6941c6;
            --border: #eaecf0;
            --ring: #f4ebff;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --glass-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        body.dark {
            --bg-color: #0c0c0c;
            --secondary-bg: #141414;
            --text-main: #f9fafb;
            --text-secondary: #9ca3af;
            --accent: #9b72f1;
            --accent-hover: #b692ff;
            --border: #262626;
            --ring: #2d1d5a;
            --card-bg: #1a1a1a;
            --header-bg: #121212;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            background: var(--header-bg);
            z-index: 10;
        }

        .header h1 {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0;
        }

        .header img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: contain;
        }

        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--secondary-bg);
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 10px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .setting-label {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .setting-description {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .control input[type="number"], .control select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            width: 80px;
            outline: none;
            transition: all 0.2s;
            background: var(--card-bg);
            color: var(--text-main);
        }

        .control select {
            width: 100px;
        }

        .control input:focus, .control select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--ring);
        }

        .media-preview-area {
            position: relative;
            margin-top: 12px;
        }

        .media-preview {
            width: 100%;
            height: 160px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
        }

        .media-preview:hover {
            border-color: var(--accent);
            background: var(--secondary-bg);
        }

        .media-preview img, .media-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .reset-media {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(16, 24, 40, 0.7);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .reset-media:hover {
            background: rgba(16, 24, 40, 0.9);
        }

        .footer {
            padding: 16px 24px;
            background: var(--header-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        button {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            border: 1px solid var(--accent);
        }

        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-secondary {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { background-color: var(--secondary-bg); }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border);
            transition: .3s;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        input:checked + .slider { background-color: var(--accent); border-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://pausecat.app/assets/pauseCat.ico" alt="PauseCat">
        <h1>PauseCat Settings</h1>
    </div>

    <div class="scroll-container">
        <div class="section-title">Schedule</div>
        <div class="card">
            <div class="setting-row">
                <div class="setting-info">
                    <span class="setting-label">Work Duration</span>
                    <span class="setting-description">Minutes before break</span>
                </div>
                <div class="control">
                    <input type="number" id="work_duration" min="5" max="240" step="5">
                </div>
            </div>
            <div class="setting-row">
                <div class="setting-info">
                    <span class="setting-label">Break Duration</span>
                    <span class="setting-description">Minutes break lasts</span>
                </div>
                <div class="control">
                    <input type="number" id="break_duration" min="1" max="30" step="1">
                </div>
            </div>
        </div>

        <div class="section-title">Visuals</div>
        <div class="card">
            <div class="setting-row">
                <div class="setting-info">
                    <span class="setting-label">Break Mode</span>
                    <span class="setting-description">Hard mode prevents skipping</span>
                </div>
                <div class="control">
                    <select id="mode">
                        <option value="soft">Soft</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
            </div>
            <div class="setting-info" style="margin-top: 20px;">
                <span class="setting-label">Custom Media</span>
                <span class="setting-description">Display your own image or video</span>
            </div>
            <div class="media-preview-area">
                <div class="media-preview" onclick="selectMedia()">
                    <div id="media-empty" class="media-placeholder">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <span>Click to change...</span>
                    </div>
                    <img id="preview-img" class="hidden">
                    <video id="preview-video" class="hidden" muted loop></video>
                </div>
                <button id="reset-btn" class="reset-media hidden" onclick="resetToDefault(event)">Reset to Default</button>
            </div>
        </div>

        <div class="section-title">System</div>
        <div class="card">
            <div class="setting-row">
                <div class="setting-info">
                    <span class="setting-label">Auto-start</span>
                    <span class="setting-description">Start when Windows logs in</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="autostart">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="btn-secondary" onclick="window.chrome.webview.postMessage({action: 'close'})">Cancel</button>
        <button class="btn-primary" onclick="save()">Apply Changes</button>
    </div>

    <script>
        let currentMediaPath = "";

        function selectMedia() {
            window.chrome.webview.postMessage({ action: "select_media" });
        }

        function resetToDefault(event) {
            event.stopPropagation();
            currentMediaPath = "default.webm";
            updatePreview("default.webm");
        }

        function save() {
            const settings = {
                work_duration_secs: document.getElementById('work_duration').value * 60,
                break_duration_secs: document.getElementById('break_duration').value * 60,
                mode: document.getElementById('mode').value,
                autostart: document.getElementById('autostart').checked,
                overlay_animation: currentMediaPath || "default.webm"
            };
            window.chrome.webview.postMessage({ action: "save", settings: settings });
        }

        window.chrome.webview.addEventListener('message', event => {
            if (event.data.action === "load") {
                const s = event.data.settings;
                document.getElementById('work_duration').value = s.work_duration_secs / 60;
                document.getElementById('break_duration').value = s.break_duration_secs / 60;
                document.getElementById('mode').value = s.mode;
                document.getElementById('autostart').checked = s.autostart;
                if (s.overlay_animation) {
                    updatePreview(s.overlay_animation);
                }
                // Apply theme immediately from initial load data
                if (event.data.isDark) {
                    document.body.classList.add('dark');
                } else {
                    document.body.classList.remove('dark');
                }
            } else if (event.data.action === "media_selected") {
                updatePreview(event.data.path);
            } else if (event.data.action === "theme_changed") {
                if (event.data.isDark) {
                    document.body.classList.add('dark');
                } else {
                    document.body.classList.remove('dark');
                }
            }
        });

        function updatePreview(path) {
            currentMediaPath = path;
            const empty = document.getElementById('media-empty');
            const img = document.getElementById('preview-img');
            const video = document.getElementById('preview-video');
            const resetBtn = document.getElementById('reset-btn');
            
            empty.classList.add('hidden');
            img.classList.add('hidden');
            video.classList.add('hidden');

            if (path === "default.webm") {
                resetBtn.classList.add('hidden');
            } else {
                resetBtn.classList.remove('hidden');
            }

            const formattedPath = (path === "default.webm") 
                ? "https://pausecat.app/assets/default.webm" 
                : (path.startsWith('https://') ? path : 'https://pausecat.app/local/' + btoa(path));

            const ext = path.split('.').pop().toLowerCase();
            if (['mp4', 'webm', 'ogg'].includes(ext)) {
                video.src = formattedPath;
                video.classList.remove('hidden');
                video.play().catch(e => console.error(e));
            } else {
                img.src = formattedPath;
                img.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
