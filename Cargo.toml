[package]
name = "pausecat"
version = "1.0.0"
edition = "2021"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_System_Memory",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Media",
    "Media_Control",
] }
webview2-com = "0.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
winreg = "0.51"
dirs = "5.0"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
lazy_static = "1.4"
base64 = "0.21"
reqwest = { version = "0.11", features = ["blocking", "json"] }
semver = "1.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
